name: Full CI/CD: Dockerize + Terraform Deployment

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: 607700977843
  ECR_REPOSITORY: strapi-app-ruitk
  ECR_REGISTRY: 607700977843.dkr.ecr.us-east-2.amazonaws.com
  IMAGE_TAG: latest

jobs:
  dockerize:
    name: Dockerize and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate Docker build and push
        run: |
          echo "Building Docker image..."
          sleep 2
          echo "Pushing to ECR..."
          # This is a simulation. Add real docker commands here.
          echo "IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: dockerize  # 👈 runs only after dockerize job is successful

    defaults:
      run:
        shell: bash
        working-directory: ./terraform11

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
